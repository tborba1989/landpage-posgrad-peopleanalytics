version: "3.8"

services:
  persoa-web:
    image: nginx:alpine
    container_name: persoa-landing
    restart: unless-stopped
    ports:
      - "8080:80"        # porta interna — será exposta pelo Nginx reverso externo
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - persoa-net

networks:
  persoa-net:
    driver: bridge
